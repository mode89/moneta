# Importing has no native branch in the app: the WebView answers
# <input type="file"> with the system file picker. Only a device can show that
# the picker opens, hands a file back and that the file reaches the app.
#
# `scripts/dev test-android` writes /sdcard/Download/moneta-import.json first, one
# expense of $42.50 named "Imported lunch", dated today so it lands in the
# open month.
appId: net.akrain.moneta
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- tapOn: "Import expenses"

# The system picker, not the app.
- assertVisible:
    id: "com.google.android.documentsui:id/.*"
- tapOn: "Show roots"
- tapOn: "Downloads"
- tapOn: "moneta-import.json"

- assertVisible: "Import this file?"
- tapOn: "Import"
- assertVisible: "Imported lunch"
- assertVisible: "$42.50"
