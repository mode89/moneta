<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="version" content="%VERSION%">
    <meta name="theme-color" content="#efe7dd">
    <title>Moneta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">

    <style>
      :root {
        --desk: #efe7dd;
        --paper: #fbf7f1;
        --seal: #a33b28;
        --ink: #2f2a2a;
        --muted: #93796a;
        --line: #ded2c4;
        --raised: #e7dccd;
        --deep: #6f5c50;
        --pressed-seal: #8a3122;
        --display: "Fraunces", Georgia, serif;
      }

      * { box-sizing: border-box; }

      html, body {
        /* inherited: suppresses the blue flash Chrome paints over a tapped
           element and everything inside it */
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        height: 100%;
        background: var(--desk);
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input { font-family: inherit; }
      :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

      /* every tappable thing darkens under the finger. The press itself is
         instant (`transition: none`) and only the release fades, so the app
         answers a tap at once without flickering on a scroll. */
      .row, .day, .set-row, .fold, .chip, .corner, .fab, .save, .ghost {
        transition: background-color 170ms ease, color 170ms ease;
      }
      .row:active, .day:active, .set-row:active, .fold:active, .corner:active,
      .fab:active, .save:active, .ghost:active {
        transition: none;
      }
      .row:active, .day:active, .set-row:active { background: var(--desk); }
      .fold:active, .ghost:active { background: var(--raised); }
      .corner:active { background: var(--line); }
      /* a chip and the month total carry no pressed style: tapping them changes
         how they themselves are drawn — selected, unblurred — and a second
         change on the way there reads as a stutter */
      .fab:active, .save:active { background: var(--pressed-seal); }

      .app {
        height: 100%;
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        background: var(--paper);
        -webkit-overflow-scrolling: touch;
        padding-bottom: 96px;
      }

      /* header */
      .head { padding: 24px 22px 12px; position: relative; }
      .month {
        font-family: var(--display);
        font-size: 1.9rem;
        font-weight: 600;
        line-height: 1.1;
      }
      .total {
        font-family: var(--display);
        font-size: 2.9rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--seal);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        margin-top: 8px;
        cursor: pointer;
        user-select: none;
        display: inline-block;
      }
      .meta {
        display: flex;
        gap: 14px;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 7px;
      }
      .meta b { font-weight: 700; color: var(--deep); font-variant-numeric: tabular-nums; }
      .meta span { white-space: nowrap; }
      .corner {
        position: absolute;
        top: 20px;
        right: 16px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: var(--raised);
        color: var(--deep);
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* category chips */
      .chiprow {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chiprow::-webkit-scrollbar { display: none; }
      .chiprow > * { flex: 0 0 auto; }
      .legend {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 6px 22px 14px;
      }
      .legend::-webkit-scrollbar { display: none; }
      .legend:empty { display: none; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 0.78rem;
        background: var(--raised);
        color: var(--deep);
        white-space: nowrap;
        cursor: pointer;
      }
      .chip.on { background: var(--ink); color: var(--paper); }
      .chip i { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
      .chip-field {
        border: none;
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 0.78rem;
        width: 8.5rem;
        background: var(--paper);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--seal);
      }
      .chip-field:focus-visible { outline: none; }

      /* list */
      .day {
        display: flex;
        justify-content: space-between;
        padding: 18px 22px 7px;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .day .sum { font-variant-numeric: tabular-nums; }
      .row {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 22px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        user-select: none;
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
      .dot.uncategorised { box-shadow: inset 0 0 0 1px var(--line); }
      .desc { font-size: 0.96rem; font-weight: 500; }
      .cats { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
      .amt {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 0.98rem;
        white-space: nowrap;
      }
      .blur-text { filter: blur(6px); }
      .empty { padding: 44px 26px; text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.65; }
      .empty b { color: var(--ink); }

      /* folded months */
      .fold {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 22px;
        border-top: 1px solid var(--line);
        background: var(--desk);
        cursor: pointer;
        user-select: none;
      }
      .fold .name { font-family: var(--display); font-size: 1.05rem; font-weight: 600; }
      .fold .help { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
      .fold .sum { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; }
      .fold .caret { color: var(--muted); font-size: 1rem; }

      /* the round + */
      .fab {
        position: absolute;
        right: 20px;
        bottom: 22px;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: none;
        background: var(--seal);
        color: var(--paper);
        font-size: 2rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 4px;
        box-shadow: 0 8px 20px rgba(163, 59, 40, 0.3);
        z-index: 3;
      }

      /* saved notice */
      .notice {
        position: absolute;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--paper);
        border-radius: 999px;
        padding: 9px 20px;
        font-size: 0.82rem;
        z-index: 10;
        box-shadow: 0 8px 20px rgba(20, 15, 12, 0.3);
      }

      /* dialogs: a dim that closes them, and the sheet or card it carries */
      /* dialogs sit above the settings screen, which they can be opened from */
      .scrim { position: absolute; inset: 0; background: rgba(47, 42, 42, 0.42); z-index: 8; }
      /* The sheet and its dim move together as one layer, which is also the
         element `Transition` watches: the transition has to be on the layer
         itself, since a child's `transitionend` carries the wrong target and
         would leave the layer in the page for ever. */
      .sheet-layer { position: absolute; inset: 0; z-index: 8; }
      .sheet-enter-active, .sheet-exit-active { transition: opacity 170ms ease; }
      .sheet-exit-active { pointer-events: none; }
      .sheet-enter-active .sheet, .sheet-exit-active .sheet { transition: transform 170ms ease; }
      .sheet-enter, .sheet-exit-to { opacity: 0; }
      .sheet-enter .sheet, .sheet-exit-to .sheet { transform: translateY(100%); }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 92%;
        overflow-y: auto;
        background: var(--paper);
        border-radius: 28px 28px 0 0;
        padding: 8px 22px 26px;
        box-shadow: 0 -14px 40px rgba(47, 42, 42, 0.22);
        z-index: 9;
      }
      .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 16px; }
      .sheet h3, .card h3 {
        font-family: var(--display);
        font-weight: 500;
        font-size: 1.3rem;
        margin: 0 0 18px;
      }
      .flabel {
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin-bottom: 5px;
      }
      .in {
        width: 100%;
        font-size: 1rem;
        border: none;
        border-bottom: 1px solid var(--line);
        background: none;
        padding: 10px 2px;
        color: var(--ink);
        margin-bottom: 16px;
        border-radius: 0;
      }
      .in.big {
        font-family: var(--display);
        font-size: 2.3rem;
        font-weight: 400;
        text-align: right;
        color: var(--seal);
        font-variant-numeric: tabular-nums;
      }
      .save {
        width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--seal);
        color: var(--paper);
        font-weight: 700;
        font-size: 1rem;
        padding: 15px;
        margin-top: 20px;
        cursor: pointer;
      }
      .ghost {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--deep);
        font-size: 0.9rem;
        padding: 13px 20px;
        cursor: pointer;
      }
      .actions { display: flex; gap: 10px; margin-top: 16px; }
      .actions .save, .actions .ghost { margin-top: 0; flex: 1; }
      .card {
        position: absolute;
        z-index: 9;
        left: 26px;
        right: 26px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--paper);
        border-radius: 24px;
        padding: 22px 20px 18px;
        box-shadow: 0 20px 50px rgba(20, 15, 12, 0.35);
      }
      .card p { font-size: 0.88rem; color: var(--muted); margin: 0 0 18px; line-height: 1.55; }
      .danger { background: var(--seal); }

      /* settings */
      .cover {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: var(--desk);
        display: flex;
        flex-direction: column;
      }
      .bar { padding: 24px 22px 14px; position: relative; }
      .bar h2 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; margin: 0; }
      .group-label {
        font-size: 0.66rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 20px 22px 8px;
      }
      .set-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 22px;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .set-title { font-size: 0.97rem; font-weight: 500; }
      .set-help { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
      .version { padding: 18px 22px; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "solid-js": "./solid.js",
          "solid-js/web": "./solid-web.js",
          "solid-js/store": "./solid-store.js",
          "solid-js/html": "./solid-html.js",
          "solid-transition-group": "./solid-transition-group.js",
          "@solid-primitives/transition-group": "./sp-transition-group.js",
          "@solid-primitives/refs": "./sp-refs.js",
          "@solid-primitives/utils": "./sp-utils.js"
        }
      }
    </script>
    <script type="module">
      import { main } from "./main.js";
      main();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
